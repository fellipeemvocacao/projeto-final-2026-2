<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Escolinha Craques</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="site-header-top">
    <div class="nav-container-top">
      <div class="logo-top">
        <h1>⚽ CRAQUES</h1>
      </div>
      <nav class="nav-menu-top">
        <ul>
          <li><a href="../index.html">HOME</a></li>
          <li><a href="nos.html">A ESCOLA</a></li>
          <li><a href="turmas.html">TURMAS</a></li>
          <li><a href="feedback.html">FEEDBACKS</a></li>
          <li><a href="contato.html" class="active">CONTATO</a></li>
        </ul>
      </nav>
      <div class="social-icons">
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
      </div>
    </div>
  </header>

  <main class="main-internal">
    <section class="card-conteudo-pagina">
      <h2>Fale Conosco & Pré-Matrícula</h2>
      <p>Preencha os dados abaixo para tirar dúvidas ou agendar uma aula experimental.</p>

      <form class="form-contato">
        <div class="campo">
          <label for="nome">Nome do Aluno(a):</label>
          <input type="text" id="nome" required placeholder="Nome completo">
        </div>
        <div class="campo">
          <label for="modalidade">Modalidade:</label>
          <select id="modalidade" required>
            <option value="">Selecione...</option>
            <option value="futebol">Futebol</option>
            <option value="volei">Vôlei</option>
          </select>
        </div>
        <div class="campo">
          <label for="whatsapp">WhatsApp:</label>
          <input type="tel" id="whatsapp" required placeholder="(11) 9XXXX-XXXX">
        </div>
        <button type="submit" class="btn">Enviar Mensagem</button>
      </form>

      <div class="acao-centro">
        <a href="../index.html" class="btn-voltar">Voltar para a Página Inicial</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="ano"></span> Escolinha de Futebol & Vôlei Craques. Todos os direitos reservados.</p>
  </footer>

  <script src="../script/script.js"></script>
</body>
</html>
